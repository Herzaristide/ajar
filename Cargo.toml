[package]
name = "ajar"
version = "0.1.0"
edition = "2021"
description = "Un espace d'écriture zen pour la littérature"
license = "GPL-3.0-or-later"

[dependencies]
relm4 = { version = "0.11", default-features = false, features = ["libadwaita", "gnome_47"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
gix = { version = "0.89", default-features = false, features = ["sha1"] }

[profile.release]
lto = "thin"
